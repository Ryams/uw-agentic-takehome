[project]
name = "uw-agent"
version = "0.1.0"
description = "Agentic underwriting assistant POC"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uw_agent"]

[tool.pytest.ini_options]
# sim-harness provides the `shared` and `leadgen` packages (registry, generator).
pythonpath = ["sim-harness", "."]
testpaths = ["tests"]
